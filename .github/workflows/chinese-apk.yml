name: Chinese APK (signed)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/zh-cn-localization
    paths:
      - '**'
      - '.github/workflows/chinese-apk.yml'

permissions:
  contents: read

concurrency:
  group: chinese-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'zhuiyun/cleanyourtv-app' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/zh-cn-localization')
    outputs:
      version: ${{ steps.apk.outputs.version }}
      version_code: ${{ steps.apk.outputs.version_code }}
      filename: ${{ steps.apk.outputs.filename }}
      sha256: ${{ steps.sign.outputs.sha256 }}
      certificate: ${{ steps.sign.outputs.certificate }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a

      - name: Test automatic release handling
        run: python3 -m unittest discover -s scripts/tests -p 'test_chinese_release.py' -v

      - name: Validate signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.CYT_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.CYT_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.CYT_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.CYT_KEYSTORE_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "::error::Missing CYT_KEYSTORE_BASE64 repository secret"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "::error::Missing CYT_KEY_ALIAS repository secret"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "::error::Missing CYT_KEY_PASSWORD repository secret"; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "::error::Missing CYT_KEYSTORE_PASSWORD repository secret"; exit 1; }

      - name: Validate keystore and certificate before building
        env:
          KEYSTORE_B64: ${{ secrets.CYT_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.CYT_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.CYT_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/signing"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/signing/cyt-release.jks"
          trap 'rm -f "$RUNNER_TEMP/signing/cyt-release.jks" "$RUNNER_TEMP/signing/cert.der"' EXIT
          keytool -exportcert -keystore "$RUNNER_TEMP/signing/cyt-release.jks" \
            -alias "$KEY_ALIAS" -storepass:env STORE_PASSWORD -file "$RUNNER_TEMP/signing/cert.der"
          EXPECTED="$(openssl x509 -in signing/zh-cn-release-cert.pem -outform DER | sha256sum | cut -d ' ' -f 1)"
          ACTUAL="$(sha256sum "$RUNNER_TEMP/signing/cert.der" | cut -d ' ' -f 1)"
          test "$ACTUAL" = "$EXPECTED" || { echo "::error::Keystore certificate does not match signing/zh-cn-release-cert.pem"; exit 1; }

      - name: Build release APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleFullRelease

      - name: Read built APK version
        id: apk
        run: |
          python3 - <<'PYTHON'
          import json, os, pathlib, re, shutil
          output = pathlib.Path("app/build/outputs/apk/full/release")
          metadata = json.loads((output / "output-metadata.json").read_text())
          assert metadata["applicationId"] == "tv.cleanyour.app"
          assert len(metadata["elements"]) == 1, "Expected exactly one release APK"
          element = metadata["elements"][0]
          version, code = element["versionName"], element["versionCode"]
          assert re.fullmatch(r"[0-9]+(?:\.[0-9]+){2,3}(?:-(?:alpha|beta|rc)\.?[0-9]+)?", version), "Unsafe APK version"
          assert isinstance(code, int) and code > 0
          source = (output / element["outputFile"]).resolve()
          assert source.parent == output.resolve() and source.suffix == ".apk"
          shutil.copyfile(source, pathlib.Path(os.environ["RUNNER_TEMP"]) / "chinese-unsigned.apk")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"version={version}\nversion_code={code}\nfilename=CleanYourTV-zh-CN-{version}.apk\n")
          PYTHON

      - name: Sign APK with the persistent independent key
        id: sign
        env:
          APK_FILE: ${{ steps.apk.outputs.filename }}
          KEYSTORE_B64: ${{ secrets.CYT_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.CYT_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.CYT_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.CYT_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/signing" dist
          trap 'rm -f "$RUNNER_TEMP/signing/cyt-release.jks" "$RUNNER_TEMP/chinese-unsigned.apk"' EXIT
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/signing/cyt-release.jks"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null || true
            "$SDKMANAGER" "build-tools;36.0.0"
          fi
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          test -x "$APKSIGNER" || { echo "::error::apksigner not found in Android SDK"; exit 1; }
          "$APKSIGNER" sign --ks "$RUNNER_TEMP/signing/cyt-release.jks" \
            --ks-key-alias "$KEY_ALIAS" --ks-pass env:STORE_PASSWORD \
            --key-pass env:KEY_PASSWORD --out "dist/$APK_FILE" "$RUNNER_TEMP/chinese-unsigned.apk"
          VERIFY_OUTPUT="$("$APKSIGNER" verify --verbose --print-certs "dist/$APK_FILE" 2>&1)"
          printf '%s\n' "$VERIFY_OUTPUT"
          EXPECTED="$(openssl x509 -in signing/zh-cn-release-cert.pem -outform DER | sha256sum | cut -d ' ' -f 1)"
          ACTUAL="$(printf '%s\n' "$VERIFY_OUTPUT" | sed -n 's/.*certificate SHA-256 digest: //p' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test "$ACTUAL" = "$EXPECTED" || { echo "::error::APK signer certificate does not match signing/zh-cn-release-cert.pem"; exit 1; }
          (cd dist && sha256sum "$APK_FILE" > SHA256SUMS.txt)
          echo "sha256=$(cut -d ' ' -f 1 dist/SHA256SUMS.txt)" >> "$GITHUB_OUTPUT"
          echo "certificate=$ACTUAL" >> "$GITHUB_OUTPUT"

      - name: Upload installable APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: CleanYourTV-zh-CN
          path: |
            dist/${{ steps.apk.outputs.filename }}
            dist/SHA256SUMS.txt
          retention-days: 90
          if-no-files-found: error

  publish:
    needs: build
    if: github.repository == 'zhuiyun/cleanyourtv-app' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/zh-cn-localization')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download this build's signed APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: CleanYourTV-zh-CN
          path: dist

      - name: Publish verified APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
          VERSION_CODE: ${{ needs.build.outputs.version_code }}
          APK_FILE: ${{ needs.build.outputs.filename }}
          APK_SHA256: ${{ needs.build.outputs.sha256 }}
          CERT_SHA256: ${{ needs.build.outputs.certificate }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){2,3}(-(alpha|beta|rc)\.?[0-9]+)?$ ]]
          [[ "$VERSION_CODE" =~ ^[0-9]+$ ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GITHUB_RUN_NUMBER" =~ ^[0-9]+$ && "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          [[ "$APK_SHA256" =~ ^[0-9a-f]{64}$ && "$CERT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test "$APK_FILE" = "CleanYourTV-zh-CN-$VERSION.apk"
          test "$GH_REPO" = "zhuiyun/cleanyourtv-app"
          case "$GITHUB_REF" in
            refs/heads/main) PRERELEASE=false ;;
            refs/heads/feature/zh-cn-localization) PRERELEASE=true ;;
            *) echo "::error::Publishing is not allowed from this branch"; exit 1 ;;
          esac
          [[ "$VERSION" != *-* ]] || PRERELEASE=true
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 2
          test "$(sha256sum "dist/$APK_FILE" | cut -d ' ' -f 1)" = "$APK_SHA256"
          test "$(cat dist/SHA256SUMS.txt)" = "$APK_SHA256  $APK_FILE"
          (cd dist && sha256sum -c SHA256SUMS.txt)
          TAG="zh-v$VERSION-build.$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT"
          TEMP="$(mktemp -d)"
          trap 'rm -rf "$TEMP"' EXIT
          # GraphQL can resolve a draft by tag name; REST /releases/tags cannot.
          release_id() {
            gh api graphql -f query='query($owner:String!, $repo:String!, $tag:String!) { repository(owner:$owner, name:$repo) { release(tagName:$tag) { databaseId } } }' \
              -f owner=zhuiyun -f repo=cleanyourtv-app -f tag="$TAG" --jq '.data.repository.release.databaseId // empty'
          }
          RELEASE_ID="$(release_id)"
          if [ -z "$RELEASE_ID" ]; then
            cat > "$TEMP/notes.md" <<EOF
          简体中文独立签名构建，使用持久签名证书。

          - APK 版本：$VERSION（versionCode $VERSION_CODE）
          - 源码提交：$GITHUB_SHA
          - 构建分支：$GITHUB_REF_NAME
          - 构建记录：$GITHUB_SERVER_URL/$GH_REPO/actions/runs/$GITHUB_RUN_ID
          - APK SHA-256：$APK_SHA256
          - 签名证书 SHA-256：$CERT_SHA256

          APK 签名和证书已校验，下载后的文件也会与本次构建逐字节比对。
          每次构建使用独立标签，历史附件不会被覆盖。同版本重建不会自动提高 Android versionCode。
          电视端遮罩仍为英文，尚未进行真实电视联调。
          EOF
            EXTRA=()
            if [ "$PRERELEASE" = true ]; then EXTRA+=(--prerelease); fi
            gh release create "$TAG" --repo "$GH_REPO" --target "$GITHUB_SHA" --draft \
              --title "CleanYourTV 简体中文 $VERSION · Build $GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT" \
              --notes-file "$TEMP/notes.md" --latest=false "${EXTRA[@]}"
            RELEASE_ID="$(release_id)"
          fi
          [[ "$RELEASE_ID" =~ ^[0-9]+$ ]]
          API="repos/$GH_REPO/releases/$RELEASE_ID"
          gh api "$API" > "$TEMP/release.json"
          jq -e --arg tag "$TAG" --arg sha "$GITHUB_SHA" --argjson pre "$PRERELEASE" \
            '.tag_name == $tag and .target_commitish == $sha and .prerelease == $pre' "$TEMP/release.json" > /dev/null
          jq -e --arg apk "$APK_FILE" '[.assets[].name] | length == (unique | length) and all(. == $apk or . == "SHA256SUMS.txt")' \
            "$TEMP/release.json" > /dev/null
          if gh api "repos/$GH_REPO/git/ref/tags/$TAG" > "$TEMP/tag.json" 2> "$TEMP/error"; then
            jq -e --arg sha "$GITHUB_SHA" '.object.type == "commit" and .object.sha == $sha' "$TEMP/tag.json" > /dev/null
          else
            grep -q '(HTTP 404)' "$TEMP/error" && jq -e '.draft == true' "$TEMP/release.json" > /dev/null
          fi
          for FILE in "$APK_FILE" SHA256SUMS.txt; do
            if ! jq -e --arg file "$FILE" '.assets | any(.name == $file)' "$TEMP/release.json" > /dev/null; then
              jq -e '.draft == true' "$TEMP/release.json" > /dev/null
              gh release upload "$TAG" "dist/$FILE" --repo "$GH_REPO"
            fi
          done
          mkdir "$TEMP/download"
          gh release download "$TAG" --repo "$GH_REPO" --dir "$TEMP/download" --pattern "$APK_FILE" --pattern SHA256SUMS.txt
          cmp "dist/$APK_FILE" "$TEMP/download/$APK_FILE"
          cmp dist/SHA256SUMS.txt "$TEMP/download/SHA256SUMS.txt"
          (cd "$TEMP/download" && sha256sum -c SHA256SUMS.txt)
          gh api "$API" > "$TEMP/release.json"
          jq -e --arg apk "$APK_FILE" '([.assets[].name] | sort) == ([$apk, "SHA256SUMS.txt"] | sort)' "$TEMP/release.json" > /dev/null
          if jq -e '.draft == true' "$TEMP/release.json" > /dev/null; then
            LATEST=false
            if [ "$PRERELEASE" = false ]; then
              HEAD="$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')"
              if [ "$HEAD" = "$GITHUB_SHA" ]; then LATEST=true; fi
            fi
            gh release edit "$TAG" --repo "$GH_REPO" --draft=false --latest="$LATEST"
          fi
          gh api "$API" > "$TEMP/release.json"
          jq -e '.draft == false and (.assets | length == 2)' "$TEMP/release.json" > /dev/null
          gh api "repos/$GH_REPO/git/ref/tags/$TAG" > "$TEMP/tag.json"
          jq -e --arg sha "$GITHUB_SHA" '.object.type == "commit" and .object.sha == $sha' "$TEMP/tag.json" > /dev/null
          URL="$(jq -r '.html_url' "$TEMP/release.json")"
          printf '### Published Chinese APK\n\n- Release: %s\n- APK SHA-256: `%s`\n' "$URL" "$APK_SHA256" >> "$GITHUB_STEP_SUMMARY"
